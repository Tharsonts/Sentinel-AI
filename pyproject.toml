[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.2.0"
description = "Plataforma experimental de anÃ¡lise de eventos visuais"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "httpx>=0.27,<1", "numpy>=1.26,<3", "opencv-python>=4.10,<5", "ultralytics>=8.4,<9", "lap>=0.5.12,<1", "psutil>=5,<8", "python-multipart>=0.0.18,<1", "pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["dashboard.html", "dashboard.css", "dashboard.js"]
